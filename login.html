<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sani Shil</title>
    
    <!-- Bootstrap v5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts: Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050505;
            --accent-1: #4338ca;
            --accent-2: #06b6d4;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* Animated Glowing Background Orbs */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.5;
            animation: float 20s infinite alternate ease-in-out;
        }
        .orb-1 {
            width: 500px; height: 500px;
            background: var(--accent-1);
            top: -10%; left: -10%;
        }
        .orb-2 {
            width: 400px; height: 400px;
            background: var(--accent-2);
            bottom: -10%; right: -10%;
            animation-delay: -5s;
        }
        @media (max-width: 575.98px) {
            .orb-1 { width: 260px; height: 260px; }
            .orb-2 { width: 220px; height: 220px; }
        }

        @keyframes float {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(100px, 100px); }
        }

        /* Glassmorphism Login Card */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .login-container {
            width: 100%;
            max-width: 420px;
            max-height: 95vh;
            overflow-y: auto;
            padding: 2rem 2rem;
        }

        @media (max-width: 575.98px) {
            .login-container {
                padding: 1.5rem 1.25rem;
                max-width: 95%;
            }
        }

        /* Custom scrollbar for overflow content */
        .login-container::-webkit-scrollbar {
            width: 6px;
        }
        .login-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .login-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        /* Gradient Text */
        .text-gradient {
            background: linear-gradient(to right, #06b6d4, #8b5cf6, #ec4899);
            background-size: 200% auto;
            color: #000;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite;
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Form Controls */
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-2);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
            color: #ffffff;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-label {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
        }

        .btn-outline-light {
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.8);
            padding: 0.75rem 2rem;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
        }

        /* Social Login Buttons */
        .social-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 0.75rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
            font-weight: 500;
            width: 100%;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-2);
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            margin: 1.5rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider::before {
            margin-right: 1rem;
        }

        .divider::after {
            margin-left: 1rem;
        }

        /* Links */
        a {
            color: var(--accent-2);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #8b5cf6;
        }

        /* Password Toggle */
        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .position-relative {
            position: relative;
        }
    </style>
</head>
<body>

    <!-- Background Orbs -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <!-- Login Container -->
    <div class="glass-panel login-container">
        
        <!-- Header -->
        <div class="text-center mb-3">
            <h1 class="fw-bold mb-2 fs-3">Welcome Back</h1>
            <p class="text-secondary mb-0 small">Sign in to continue to your account</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            
            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="position-relative">
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                    <i class="bi bi-eye password-toggle" id="togglePassword"></i>
                </div>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-secondary small" for="rememberMe">
                        Remember me
                    </label>
                </div>
                <a href="http://localhost:4200/admin/" class="small">Forgot Password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary w-100 mb-2">
                Sign In <i class="bi bi-arrow-right ms-2"></i>
            </button>

        </form>

        <!-- Divider -->
        <div class="divider" style="margin: 1rem 0;">or continue with</div>

        <!-- Social Login -->
        <div class="row g-2 mb-3">
            <div class="col-6">
                <a href="#" class="social-btn">
                    <i class="bi bi-google"></i> Google
                </a>
            </div>
            <div class="col-6">
                <a href="#" class="social-btn">
                    <i class="bi bi-github"></i> GitHub
                </a>
            </div>
        </div>

        <!-- Sign Up Link -->
        <p class="text-center text-secondary small mb-0">
            Don't have an account? <a href="signup.html" class="fw-semibold">Sign Up</a>
        </p>

        <!-- Back to Home -->
        <div class="text-center mt-3">
            <a href="index.html" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left me-2"></i> Back to Home
            </a>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script>
        // Password Toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            togglePassword.classList.toggle('bi-eye');
            togglePassword.classList.toggle('bi-eye-slash');
        });

        // Form Submit
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Add your login logic here
            console.log('Login attempt:', { email, password });
            
            // Example success redirect
            // window.location.href = 'dashboard.html';
        });
    </script>

</body>
</html>
