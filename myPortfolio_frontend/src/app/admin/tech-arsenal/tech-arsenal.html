<!-- Header -->
<div class="mb-8 flex items-center justify-between gap-4 flex-wrap">
  <div>
    <h1 class="text-2xl font-bold text-white">Tech Arsenal</h1>
    <p class="text-gray-400 text-sm mt-1">Add or remove skills shown in the portfolio.</p>
  </div>
  <button
    (click)="save()"
    class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-sm font-medium px-5 py-2.5 rounded-xl transition-all"
  >
    @if (saved()) {
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      Saved!
    } @else {
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
      </svg>
      Save Changes
    }
  </button>
</div>

<!-- Add skill form -->
<div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 mb-6">
  <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider mb-4">Add New Skill</h2>
  <div class="flex flex-col sm:flex-row gap-3">
    <input
      [(ngModel)]="newSkill.name"
      name="skillName"
      (keydown.enter)="addSkill()"
      placeholder="Skill name…"
      class="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-colors"
    />
    <select
      [(ngModel)]="newSkill.category"
      name="skillCat"
      class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors"
    >
      @for (cat of categories; track cat) {
        <option [value]="cat">{{ cat }}</option>
      }
    </select>
    <button
      (click)="addSkill()"
      class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-5 py-2.5 rounded-xl transition-colors whitespace-nowrap"
    >
      + Add
    </button>
  </div>
</div>

<!-- Skill groups -->
<div class="space-y-5">
  @for (cat of categories; track cat) {
    @if (byCategory(cat).length > 0) {
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-sm font-semibold text-gray-300">{{ cat }}</h2>
          <span class="text-xs text-gray-500">{{ byCategory(cat).length }} skills</span>
        </div>
        <div class="flex flex-wrap gap-2">
          @for (skill of byCategory(cat); track skill.id) {
            <span class="inline-flex items-center gap-1.5 bg-gray-800 border border-gray-700 rounded-full px-3 py-1 text-sm text-gray-200">
              {{ skill.name }}
              <button
                (click)="removeSkill(skill.id)"
                class="text-gray-500 hover:text-red-400 transition-colors leading-none"
                aria-label="Remove {{ skill.name }}"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>
            </span>
          }
        </div>
      </div>
    }
  }
</div>
