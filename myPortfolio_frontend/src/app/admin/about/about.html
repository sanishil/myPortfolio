<!-- Header -->
<div class="mb-8 flex items-center justify-between gap-4 flex-wrap">
  <div>
    <h1 class="text-2xl font-bold text-white">About Section</h1>
    <p class="text-gray-400 text-sm mt-1">Edit your personal info displayed on the portfolio.</p>
  </div>
  <button
    (click)="save()"
    class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-sm font-medium px-5 py-2.5 rounded-xl transition-all"
  >
    @if (saved()) {
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      Saved!
    } @else {
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
      </svg>
      Save Changes
    }
  </button>
</div>

<form (ngSubmit)="save()" class="space-y-6">

  <!-- Identity -->
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
    <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider mb-5">Identity</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

      <div class="flex flex-col gap-1.5">
        <label class="text-xs text-gray-400 font-medium">Full Name</label>
        <input [(ngModel)]="form.name" name="name"
          class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-colors"
          placeholder="Your name" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs text-gray-400 font-medium">Job Title</label>
        <input [(ngModel)]="form.title" name="title"
          class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-colors"
          placeholder="e.g. Associate SDE" />
      </div>

      <div class="flex flex-col gap-1.5 md:col-span-2">
        <label class="text-xs text-gray-400 font-medium">Bio</label>
        <textarea [(ngModel)]="form.bio" name="bio" rows="4"
          class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-colors resize-none"
          placeholder="Short bio displayed on portfolio"></textarea>
      </div>

      <!-- Available toggle -->
      <div class="flex items-center gap-3 md:col-span-2">
        <button
          type="button"
          (click)="form.available = !form.available"
          [class]="form.available ? 'bg-green-500' : 'bg-gray-700'"
          class="relative w-11 h-6 rounded-full transition-colors duration-200 focus:outline-none"
        >
          <span
            [class]="form.available ? 'translate-x-5' : 'translate-x-1'"
            class="absolute top-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform duration-200 inline-block"
          ></span>
        </button>
        <span class="text-sm text-gray-300">Available for new opportunities</span>
      </div>
    </div>
  </div>

  <!-- Location -->
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
    <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider mb-5">Location</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div class="flex flex-col gap-1.5">
        <label class="text-xs text-gray-400 font-medium">City / Region</label>
        <input [(ngModel)]="form.location" name="location"
          class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-colors"
          placeholder="e.g. Agartala, Tripura, India" />
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-xs text-gray-400 font-medium">Timezone</label>
        <input [(ngModel)]="form.timezone" name="timezone"
          class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-colors"
          placeholder="e.g. IST (UTC +5:30)" />
      </div>
    </div>
  </div>

  <!-- Links -->
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
    <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider mb-5">Links</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

      <div class="flex flex-col gap-1.5">
        <label class="text-xs text-gray-400 font-medium">Email</label>
        <input [(ngModel)]="form.email" name="email" type="email"
          class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-colors"
          placeholder="you@email.com" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs text-gray-400 font-medium">GitHub URL</label>
        <input [(ngModel)]="form.github" name="github"
          class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-colors"
          placeholder="https://github.com/..." />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs text-gray-400 font-medium">LinkedIn URL</label>
        <input [(ngModel)]="form.linkedin" name="linkedin"
          class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-colors"
          placeholder="https://linkedin.com/in/..." />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs text-gray-400 font-medium">CV / Resume URL</label>
        <input [(ngModel)]="form.cv" name="cv"
          class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-colors"
          placeholder="https://drive.google.com/..." />
      </div>
    </div>
  </div>

</form>
